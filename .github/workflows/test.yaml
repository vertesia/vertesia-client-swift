name: Swift package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify generated sources
        run: scripts/regenerate.sh --check
      - name: Run portable Swift tests
        run: swift test --disable-xctest

  test-apple:
    name: Apple-specific tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run native SSE and OAuth tests
        run: swift test --disable-xctest --filter ApplePlatformTests
