name: License Check

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # GitHub's dependency graph reads SwiftPM dependencies only from Package.resolved, so a dependency
  # added to Package.swift alone would pass the license review unseen. Fail when the committed
  # Package.resolved is missing or differs from what Package.swift resolves to.
  swiftpm-resolved:
    name: Package.resolved matches Package.swift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the package dependencies
        run: |
          set -euo pipefail
          swift package resolve
          if [[ -n "$(git status --porcelain --ignored -- Package.resolved)" ]]; then
            echo "::error file=Package.swift::Package.resolved is missing or out of date. Run 'swift package resolve' and commit Package.resolved: the license review reads dependencies only from it."
            git --no-pager diff -- Package.resolved || true
            exit 1
          fi

  dependency-review:
    name: Dependency license review
    runs-on: ubuntu-latest
    steps:
      # Fails the PR when it adds or updates a dependency under a denied license. Vulnerabilities are
      # left to Dependabot: this check is about licenses only. Dependencies whose license GitHub cannot
      # detect are reported without failing the check.
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          vulnerability-check: false
          license-check: true
          # deny-licenses is deprecated in favour of allow-licenses but still supported by v5; it encodes
          # the policy as stated (block these licenses, accept everything else).
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-1.0-only, GPL-1.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            LGPL-2.0-only, LGPL-2.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later,
            SSPL-1.0, BUSL-1.1, Elastic-2.0, JSON
